name: KuzuDB .NET Tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore "KuzuDB-net/KuzuDB-Net.Tests/KuzuDB-Net.Tests.csproj"

      - name: Build
        run: dotnet build "KuzuDB-net/KuzuDB-Net.Tests/KuzuDB-Net.Tests.csproj" --configuration Release --no-restore

      - name: Test
        run: dotnet test "KuzuDB-net/KuzuDB-Net.Tests/KuzuDB-Net.Tests.csproj" --configuration Release --no-build
